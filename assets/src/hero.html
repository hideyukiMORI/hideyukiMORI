<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
:root{--bg:#F6F3EC;--ink:#14120F;--mute:#7b766b;--rule:#e2ddd0;--accent:#D64525}
html.dark{--bg:#14120F;--ink:#F6F3EC;--mute:#a09a8d;--rule:#2a2722}
*{margin:0;box-sizing:border-box}
body{width:1280px;height:640px;background:var(--bg);color:var(--ink);position:relative;overflow:hidden;font-family:"Zen Kaku Gothic New",sans-serif}
.bar{position:absolute;inset:0 0 auto 0;height:3px;background:var(--accent)}
.eyebrow{position:absolute;left:100px;top:121px;font:400 18.5px/1 "IBM Plex Mono",monospace;letter-spacing:.25em;color:var(--mute);display:flex;align-items:center;white-space:nowrap}
.eyebrow i{width:8px;height:8px;background:var(--accent);margin-right:14px}
.eyebrow b{font-weight:500;color:var(--accent);margin:0 .75em 0 .6em}
h1{position:absolute;left:96px;top:168px;font-weight:700;font-size:97.5px;line-height:107px;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.rule{position:absolute;left:100px;right:100px;top:452px;height:1px;background:var(--rule)}
.name{position:absolute;left:100px;top:492px;font-weight:700;font-size:30px;line-height:40px;letter-spacing:-.005em}
.line{position:absolute;left:290px;top:495px;font:400 16.6px/24px 'IBM Plex Mono',monospace;color:var(--mute);white-space:nowrap}
.url{position:absolute;right:100px;top:572px;font:400 16px/24px 'IBM Plex Mono',monospace;letter-spacing:.075em;color:var(--mute)}
</style></head><body>
<div class="bar"></div>
<div class="eyebrow"><i></i>SOFTWARE ENGINEER <b>/</b> NATIVE WINDOWS APPS <b>/</b> SELF-HOSTED</div>
<h1>Engineering<br>you can verify<span>.</span></h1>
<div class="rule"></div>
<div class="name">Hideyuki Mori</div>
<div class="line">Small Windows tools and self-hosted software, built in the open — C++ · C · PHP.</div>
<div class="url">github.com/hideyukiMORI</div>
</body></html>
